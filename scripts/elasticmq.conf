# ElasticMQ configuration for the integration tests (mounted by compose.yaml). The tests create
# their own queues, with a dead-letter queue each, through the API.
include classpath("application.conf")
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}
